name: Monthly Ansible Collection Sync

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs at midnight on the 1st of each month
  workflow_dispatch:  # Allows manual triggering

jobs:
  sync-ansible-collections:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Install required system packages and Ansible Core
      - name: Install Python3, pip, and Ansible Core
        run: |
          sudo apt-get update && sudo apt-get install -y python3 python3-pip
          pip3 install ansible-core

      # Build and Publish Collections for all namespaces
      - name: Build and Publish Collections
        run: |
          for namespace in namespaces/*; do
            if [ -d "$namespace" ]; then
              echo "📂 Processing namespace: $namespace"
              for collection in "$namespace"/*; do
                if [ -d "$collection" ]; then
                  echo "🚀 Building collection: $collection"
                  ansible-galaxy collection build "$collection" --output-path "$collection"
                  
                  # Locate the tar file (ensure it's correctly placed)
                  TAR_FILE=$(find "$collection" -maxdepth 1 -name '*.tar.gz' | head -n 1)
                  
                  if [ -f "$TAR_FILE" ]; then
                    echo "📦 Built collection: $TAR_FILE"
                    
                    echo "📡 Publishing $TAR_FILE"
                    ansible-galaxy collection publish "$TAR_FILE" \
                      --server https://platform.cus-l3n9so.aws.ansiblecloud.redhat.com/api/galaxy/ \
                      --api-key ${{ secrets.PAH_API_KEY }} \
                      --force
                  else
                    echo "❌ ERROR: No .tar.gz file found for $collection"
                    exit 1
                  fi
                fi
              done
            fi
          done


