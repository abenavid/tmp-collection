stages:
  - sync
  - build

sync_from_github:
  stage: sync
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"
    - git remote add github https://$GITHUB_PAT@github.com/abenavid/mock-collection.git || git remote set-url github https://$GITHUB_PAT@github.com/abenavid/mock-collection.git
    - git remote add gitlab https://username:$GITLAB_PAT@gitlab.consulting.redhat.com/internal-ansible-library/test.git || git remote set-url gitlab https://username:$GITLAB_PAT@gitlab.consulting.redhat.com/internal-ansible-library/test.git
    - git fetch github
    - git checkout -B main github/main
    - git fetch gitlab
    - git merge --allow-unrelated-histories gitlab/main || echo "No conflicts detected."
    - git push gitlab main
  tags:
    - internal
    - pah

build_collections:
  stage: build
  script:
    - apt-get update && apt-get install -y python3 python3-pip
    - pip3 install ansible-core
    - mkdir -p output  # Ensure the output directory exists
    - echo "Current directory: $(pwd)"
    - echo "Listing all files in the repository:"
    - ls -R
    - |
      # Find all collections dynamically and build them
      for collection_dir in $(find . -type f -name "galaxy.yml" -exec dirname {} \;); do
        echo "Found collection directory: $collection_dir"
        cd "$collection_dir"
        ansible-galaxy collection build || { echo "Failed to build collection in $collection_dir"; exit 1; }
        mv *.tar.gz /builds/internal-ansible-library/test/output/ || { echo "Failed to move tar.gz for $collection_dir"; exit 1; }
        cd -  # Return to the previous directory
      done
    - echo "Listing contents of output directory:"
    - ls -l /builds/internal-ansible-library/test/output/
  artifacts:
    paths:
      - output/*.tar.gz
    expire_in: 1 week
  tags:
    - internal
    - pah