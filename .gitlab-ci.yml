stages:
  - sync
  - build

sync_from_github:
  stage: sync
  script:
    # Install Git
    - apt-get update && apt-get install -y git

    # Configure Git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"

    # Clone the GitHub repository into the GitLab pipeline
    - git clone https://$TMP_GITHUB_PAT@github.com/abenavid/tmp-collection.git github_repo

    # Change into the cloned GitHub directory
    - cd github_repo

    # Add GitLab as a remote
    - git remote add gitlab https://$TMP_GITLAB_PAT@gitlab.consulting.redhat.com/internal-ansible-library/test.git || \
      git remote set-url gitlab https://$TMP_GITLAB_PAT@gitlab.consulting.redhat.com/internal-ansible-library/test.git

    # Fetch latest changes from both repositories
    - git fetch --all

    # Force push GitHub repository contents into GitLab
    - echo "Pushing GitHub repository into GitLab..."
    - git push --force gitlab main

  tags:
    - internal
    - pah


