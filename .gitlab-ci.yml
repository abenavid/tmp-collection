stages:
  - sync
  - build

sync_to_github:
  stage: sync
  script:
    # Install Git
    - apt-get update && apt-get install -y git

    # Configure Git user
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"

    # Fetch latest changes from GitLab and GitHub
    - git fetch --all

    # Checkout main branch from GitLab
    - git checkout -B main origin/main

    # Merge latest GitHub changes into GitLab's main branch (if any)
    - git merge --allow-unrelated-histories github/main || echo "No conflicts, merge complete."

    # Push the updated branch to GitHub
    - echo "Pushing to GitHub..."
    - git push --force github main || echo "Push to GitHub failed!"

  tags:
    - internal
    - pah


