stages:
  - sync
  - validate
  - merge

# ✅ Sync from GitHub to GitLab (for `main`)
sync_from_github:
  stage: sync
  only:
    - main
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"
    - git remote -v
    - git fetch --all
    - git checkout -B main github/master
    - git merge --allow-unrelated-histories origin/main || echo "No conflicts detected."
    - echo "Pushing GitHub repository into GitLab..."
    - git push --force gitlab main
    - git remote -v
  tags:
    - internal
    - pah

# ✅ Sync from GitLab `main` to GitHub (Keeps GitHub Updated)
sync_to_github:
  stage: sync
  only:
    - main
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"
    - rm -rf tmp_repo
    - git clone https://$TMP_GITHUB_PAT@github.com/abenavid/tmp-collection.git tmp_repo
    - cd tmp_repo
    - git remote add gitlab https://abenavid:$TMP_GITLAB_PAT@gitlab.consulting.redhat.com/internal-ansible-library/test.git
    - git fetch --all
    - git remote -v
    - git checkout master || git checkout -B master origin/master
    - git fetch gitlab main || echo "GitLab main branch not found."
    - git branch -r | grep "gitlab/main" && git merge --allow-unrelated-histories gitlab/main || echo "GitLab main branch does not exist, skipping merge."
    - git checkout gitlab/main -- .gitlab-ci.yml || echo ".gitlab-ci.yml not found, skipping restore."
    - git add .gitlab-ci.yml
    - git commit -m "Preserve .gitlab-ci.yml after merge" || echo "No changes to commit."
    - git gc --prune=now
    - git repack -a -d --depth=250 --window=250
    - git push --force --thin origin master
  tags:
    - internal
    - pah

# ✅ Validate Changes Before Merging to Staging
validate_staging:
  stage: validate
  only:
    - staging
  script:
    - echo "Running validation on staging..."
    - apt-get update && apt-get install -y ansible-lint
    - ansible-lint roles/ || echo "⚠️ Warnings detected"
    - echo "✅ Validation Passed!"
  tags:
    - internal
    - pah

# ✅ Merge Personal Branches to Staging (Auto Approve)
merge_to_staging:
  stage: merge
  only:
    - merge_requests
  script:
    - echo "🔄 Merging feature branch into staging..."
    - git checkout staging
    - git merge --ff-only origin/$CI_COMMIT_REF_NAME || (echo "⚠️ Merge conflict detected, requires manual resolution." && exit 1)
    - git push origin staging
    - echo "✅ Merged successfully to staging!"
  tags:
    - internal
    - pah

# ✅ Merge Staging to Main (Manually Approved)
merge_staging_to_main:
  stage: merge
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"
    - echo "🔄 Fetching latest updates..."
    - git fetch --all
    - echo "🔀 Checking out main branch..."
    - git checkout main
    - echo "🚀 Merging staging into main..."
    - git merge staging --no-edit || echo "No conflicts detected."
    - echo "📤 Pushing changes to main..."
    - git push origin main
  tags:
    - internal
    - pah
