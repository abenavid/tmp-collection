stages:
  - sync
  - build

sync_to_github:
  stage: sync
  before_script:
    - apt-get update && apt-get install -y git openssh-client
    - git --version

    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan github.com >> ~/.ssh/known_hosts

  script:
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"

    - if git remote | grep -q "github"; then
        git remote set-url github git@github.com:abenavid/tmp-collection.git;
      else
        git remote add github git@github.com:abenavid/tmp-collection.git;
      fi

    - git fetch --all
    - git checkout -B main origin/main

    - git fsck --full || echo "No issues detected."
    - git gc --prune=now
    - git repack -A -d --depth=250 --window=250

    - echo "Attempting to push to GitHub..."
    - git push --force github main || \
      (echo "Push failed, retrying with repack..." && git gc --prune=now && git repack -A -d --depth=250 --window=250 && git push --force github main)

  tags:
    - internal
    - pah

