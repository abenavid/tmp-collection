stages:
  - sync
  - build

sync_to_github:
  stage: sync
  script:
    # Install Git
    - apt-get update && apt-get install -y git

    # Configure Git user
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"

    # Add GitHub as remote (force update in case it already exists)
    - git remote remove github || true
    - git remote add github https://$TMP_GITHUB_PAT@github.com/abenavid/tmp-collection.git

    # Fetch latest changes
    - git fetch --all

    # Checkout main branch from GitLab
    - git checkout -B main origin/main

    # Merge latest GitHub changes
    - git merge --allow-unrelated-histories github/main || echo "No conflicts, merge complete."

    # Run Git maintenance commands to prevent push errors
    - git fsck --full || echo "No integrity issues found."
    - git gc --prune=now
    - git repack -A -d --depth=250 --window=250

    # Attempt to push to GitHub
    - echo "Pushing to GitHub..."
    - git push --force github main || \
      (echo "Push failed, retrying with repack..." && git gc --prune=now && git repack -A -d --depth=250 --window=250 && git push --force github main)

  tags:
    - internal
    - pah


