stages:
  - sync

sync_from_github:
  stage: sync
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"
    
    # Verify remotes
    - git remote -v
    - git fetch --all

    # Checkout latest GitHub changes
    - git checkout -B main github/master
    - git merge --allow-unrelated-histories origin/main || echo "No conflicts detected."
    
    # Push merged updates to GitLab
    - echo "Pushing GitHub repository into GitLab..."
    - git push --force gitlab main
    - git remote -v
  tags:
    - internal
    - pah

sync_to_github:
  stage: sync
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"

    - git remote set-url github https://$TMP_GITHUB_PAT@github.com/abenavid/tmp-collection.git
    - git remote -v
    - git fetch gitlab
    - git checkout -B master gitlab/main 
    - git merge gitlab/main || echo "No conflicts detected."

    # Push updated code back to GitHub (on `master`)
    - git push --force github master


