stages:
  - sync
  - build

sync_from_github:
  stage: sync
  image: ubuntu:20.04
  script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "abenavid@redhat.com"
    - git config --global user.name "Alex Benavides"
    - |
      git remote add github https://$GITHUB_PAT@github.com/abenavid/mock-collection.git || \
      git remote set-url github https://$GITHUB_PAT@github.com/abenavid/mock-collection.git
    - |
      git remote add gitlab https://username:$GITLAB_PAT@gitlab.consulting.redhat.com/internal-ansible-library/test.git || \
      git remote set-url gitlab https://username:$GITLAB_PAT@gitlab.consulting.redhat.com/internal-ansible-library/test.git
    - git fetch github
    - git checkout -B main github/main
    - git fetch gitlab
    - git merge --allow-unrelated-histories gitlab/main || echo "No conflicts detected."
    - git push gitlab main
  tags:
    - internal
    - pah

build_collections:
  stage: build
  script:
    - apt-get update && apt-get install -y python3 python3-pip
    - pip3 install ansible-core
    - mkdir -p output
    - echo "Starting collection build process..."
    - |
      for namespace in mock_namespace mock_namespace_2 mock_namespace_3; do
        echo "Building collection in namespace: $namespace";
        if [ -d "$namespace/mock_collection" ]; then
          cd $namespace/mock_collection || exit 1;
          ansible-galaxy collection build --output-path=../../../output --force || echo "Collection build failed for $namespace!";
          cd - || exit 1;
        else
          echo "Directory $namespace/mock_collection does not exist! Skipping...";
        fi;
      done
    - echo "Build complete. Output contents:"
    - ls -al output
    - if ls output/*.tar.gz 1> /dev/null 2>&1; then
        echo "Uploading artifacts...";
      else
        echo "No artifacts to upload.";
      fi
  artifacts:
    paths:
      - output/*.tar.gz
    expire_in: 1 week
  tags:
    - internal
    - pah